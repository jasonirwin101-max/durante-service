<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E31837" />
    <title>Durante Equipment — Tech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Durante Portal Back Link -->
    <script>
    (function() {
      if (window.location.hostname === 'duranteops.com' || window.location.hostname === 'www.duranteops.com') return;

      function inject() {
        if (document.getElementById('duranteops-portal-link')) return;

        var link = document.createElement('a');
        link.id = 'duranteops-portal-link';
        link.href = 'https://duranteops.com';
        link.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>PORTAL';
        link.style.cssText = 'position:fixed;top:12px;left:12px;z-index:99999;display:inline-flex;align-items:center;padding:6px 12px;background:rgba(15,17,22,0.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;text-decoration:none;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;border:1px solid rgba(230,57,70,0.4);border-radius:4px;transition:all 0.15s ease;cursor:pointer';

        link.onmouseenter = function() {
          link.style.background = 'rgba(230,57,70,0.95)';
          link.style.borderColor = 'rgba(230,57,70,1)';
          link.style.transform = 'translateX(-2px)';
        };
        link.onmouseleave = function() {
          link.style.background = 'rgba(15,17,22,0.85)';
          link.style.borderColor = 'rgba(230,57,70,0.4)';
          link.style.transform = 'translateX(0)';
        };

        document.body.appendChild(link);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', inject);
      } else {
        inject();
      }
    })();
    </script>
  </body>
</html>
